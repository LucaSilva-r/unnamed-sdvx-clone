name: Build
on: [push, workflow_dispatch]
permissions:
    contents: read
    actions: write
jobs:
    windows_build:
        name: Windows build
        runs-on: windows-latest
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        env:
            VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
            VCPKG_FEATURE_FLAGS: "manifests,binarycaching"
        steps:
            - name: Checkout repo
              uses: actions/checkout@v1
            - name: Checkout submodules
              run: git submodule update --init --recursive
            - name: Fetch Live2D Cubism SDK Core
              shell: bash
              env:
                LIVE2D_TOKEN: ${{ secrets.LIVE2D_SDK_TOKEN }}
                LIVE2D_REPO: ${{ secrets.LIVE2D_SDK_REPO }}
              if: env.LIVE2D_TOKEN != ''
              run: |
                git clone https://${LIVE2D_TOKEN}@github.com/${LIVE2D_REPO}.git _cubism_sdk
                mv _cubism_sdk/Core third_party/CubismSdkCore
                rm -rf _cubism_sdk
            - name: Cache vcpkg
              uses: actions/cache@v4
              with:
                path: |
                  vcpkg
                  vcpkg_installed
                key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
            - name: vcpkg
              run: |
                if(!(Test-Path .\vcpkg))
                {
                git clone https://github.com/microsoft/vcpkg.git
                cd vcpkg
                .\bootstrap-vcpkg.bat
                }
            - name: cmake
              run: |
                $live2d_flag = if (Test-Path "third_party\CubismSdkCore") { "-DENABLE_LIVE2D=ON" } else { "-DENABLE_LIVE2D=OFF" }
                cmake -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_MANIFEST_MODE=ON -DVCPKG_MANIFEST_INSTALL=ON -DBUNDLE_RUNTIME_DLLS=ON $live2d_flag -G "Visual Studio 17 2022" -A x64 .
            - name: Setup MSBuild.exe
              uses: microsoft/Setup-MSBuild@v1.0.2
            - name: MSBuild
              run: msbuild USC.sln -p:Configuration=Release /m /verbosity:minimal
            - name: Verify bundled FFmpeg DLLs
              run: |
                $required = @("avcodec", "avformat", "avutil", "swscale", "swresample")
                foreach($name in $required)
                {
                  $matches = Get-ChildItem -Path .\bin -Filter "$name*.dll" -ErrorAction SilentlyContinue
                  if(-not $matches)
                  {
                    Write-Error "Missing required runtime DLL: $name*.dll in .\bin"
                    exit 1
                  }
                }
                Write-Host "Bundled FFmpeg runtime DLLs:"
                Get-ChildItem -Path .\bin -Filter "av*.dll" | ForEach-Object { Write-Host $_.Name }
                Get-ChildItem -Path .\bin -Filter "sw*.dll" | ForEach-Object { Write-Host $_.Name }
            - name: Tests
              run: rm ./bin/Tests.*
            - name: Get Symbols 
              continue-on-error: true
              run: |
                mkdir -f .\bin\crash_dumps\
                cp .\third_party\breakpad
                .\third_party\breakpad\dump_syms.exe .\bin\usc-game.pdb > .\bin\crash_dumps\usc-game.syms
                mv .\bin\usc-game.pdb .\bin\crash_dumps\.
            - name: Copy FrameworkShaders for Live2D
              shell: bash
              run: |
                rm -rf bin/FrameworkShaders
                if [ -d third_party/CubismNativeFramework/src/Rendering/OpenGL/Shaders/Standard ]; then
                  cp -r third_party/CubismNativeFramework/src/Rendering/OpenGL/Shaders/Standard bin/FrameworkShaders
                fi
            - name: Upload artifact
              uses: actions/upload-artifact@master
              with:
                name: Game
                path: bin
    linux_build:
        name: Linux build
        runs-on: ubuntu-latest
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        steps:
            - name: Checkout repo
              uses: actions/checkout@v1
            - name: Checkout submodules
              run: git submodule update --init --recursive
            - name: Fetch Live2D Cubism SDK Core
              env:
                LIVE2D_TOKEN: ${{ secrets.LIVE2D_SDK_TOKEN }}
                LIVE2D_REPO: ${{ secrets.LIVE2D_SDK_REPO }}
              if: env.LIVE2D_TOKEN != ''
              run: |
                git clone https://${LIVE2D_TOKEN}@github.com/${LIVE2D_REPO}.git _cubism_sdk
                mv _cubism_sdk/Core third_party/CubismSdkCore
                rm -rf _cubism_sdk
            - name: Install packages
              run: |
                sudo apt-get update
                sudo apt-get install g++ pkg-config libegl1-mesa-dev libglu1-mesa-dev libfreetype6-dev libogg-dev libvorbis-dev libsdl2-dev libarchive-dev zlib1g-dev libjpeg-dev libpng-dev libavcodec-dev libavformat-dev libswscale-dev libswresample-dev libavutil-dev
                sudo add-apt-repository universe
                sudo apt install libfuse2
            - name: cmake
              run: |
                LIVE2D_FLAG=""
                if [ -d "third_party/CubismSdkCore" ]; then LIVE2D_FLAG="-DENABLE_LIVE2D=ON"; fi
                cmake -DCMAKE_BUILD_TYPE=Release -DUSC_GNU_WERROR=Off $LIVE2D_FLAG .
            - name: make
              run: make
            - name: Prepare for bundling AppImage
              run: |
                sudo apt-get install appstream
                wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
                chmod +x linuxdeploy-x86_64.AppImage
            - name: Bundle AppImage
              run: |
                ./linuxdeploy-x86_64.AppImage --custom-apprun appimage/AppRun -d appimage/usc-game.desktop -i appimage/usc-game.png -e bin/usc-game --appdir usc-appdir --output appimage
                mv usc-game*.AppImage bin/usc-game.AppImage
                chmod +x bin/usc-game.AppImage
                rm bin/usc-game bin/Tests.*
            - name: Pack everything into .tar.gz archive
              run: cd bin && tar -czvf ../Game_linux_AppImage.tar.gz *
            - name: Upload artifact
              uses: actions/upload-artifact@master
              with:
                name: Game_linux_AppImage
                path: Game_linux_AppImage.tar.gz
    macos_build:
        name: macOS build
        runs-on: macos-latest
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        steps:
            - name: Checkout repo
              uses: actions/checkout@v1
            - name: Checkout submodules
              run: git submodule update --init --recursive
            - name: Fetch Live2D Cubism SDK Core
              env:
                LIVE2D_TOKEN: ${{ secrets.LIVE2D_SDK_TOKEN }}
                LIVE2D_REPO: ${{ secrets.LIVE2D_SDK_REPO }}
              if: env.LIVE2D_TOKEN != ''
              run: |
                git clone https://${LIVE2D_TOKEN}@github.com/${LIVE2D_REPO}.git _cubism_sdk
                mv _cubism_sdk/Core third_party/CubismSdkCore
                rm -rf _cubism_sdk
            - name: brew update
              run: brew update
            - name: Install packages
              run: brew install freetype libvorbis sdl2 libpng jpeg-turbo libarchive ffmpeg pkg-config
            - name: cmake
              run: |
                LIVE2D_FLAG=""
                if [ -d "third_party/CubismSdkCore" ]; then LIVE2D_FLAG="-DENABLE_LIVE2D=ON"; fi
                cmake -DCMAKE_BUILD_TYPE=Release $LIVE2D_FLAG .
            - name: make
              run: make
            - name: Copy FrameworkShaders for Live2D
              run: |
                rm -rf bin/FrameworkShaders
                if [ -d third_party/CubismNativeFramework/src/Rendering/OpenGL/Shaders/Standard ]; then
                  cp -r third_party/CubismNativeFramework/src/Rendering/OpenGL/Shaders/Standard bin/FrameworkShaders
                fi
            - name: Upload artifact
              uses: actions/upload-artifact@master
              with:
                name: Game_mac
                path: bin
    distribution_trigger:
        name: Artifact distribution trigger
        runs-on: windows-latest
        if: github.ref == 'refs/heads/master'
        needs: [windows_build, linux_build, macos_build]
        steps:
            - name: Trigger artifact distribution
              continue-on-error: true
              run: |
                Invoke-RestMethod -Method POST -ContentType "application/json" -Body '{ "id": ${{ github.run_id }}}' -Uri ${{ secrets.WEBHOOK_URL }}
